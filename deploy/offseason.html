<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameBlazers Golf — Offseason</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --ink: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Prompt", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 34rem;
      width: 100%;
      background: var(--panel);
      border: 1px solid #21262d;
      border-radius: 16px;
      padding: 3rem 2.25rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .logo { height: 56px; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      margin-bottom: 1.4rem;
    }
    h1 { font-size: 1.7rem; font-weight: 800; margin: 0 0 0.9rem; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0.4rem 0; }
    .return { color: var(--ink); font-weight: 500; margin-top: 1.4rem; }
    footer { margin-top: 2rem; font-size: 0.8rem; color: #545d68; }
  </style>
</head>
<body>
  <main class="card">
    <img src="https://gameblazers.com/gb-logo.png" alt="GameBlazers" class="logo" onerror="this.style.display='none'" />
    <div class="badge">Offseason</div>
    <h1>GameBlazers Golf is currently in its offseason</h1>
    <p>The Fantasy Golf lineup optimizer is paused while the NFL season runs.</p>
    <p class="return">It will return in 2027.</p>
    <footer>GameBlazers &bull; Fantasy Golf</footer>
  </main>
</body>
</html>
